# Example configuration — copy to config.yaml or edit via Control Panel.
# config.yaml is gitignored (may contain your API keys).

backend:
  provider: gemini   # gemini | openrouter | huggingface

gemini:
  # Three modality slots — Studio picks by prompt intent (cheapest defaults)
  text_model: gemini-2.5-flash
  image_model: gemini-2.5-flash-image
  video_model: veo-2.0-generate-001
  api_key: null
  google_search: true
  # Pass 1: search & extract with sourceSnippets; Pass 2: verify at temperature 0
  two_pass_verify: true
  # Local file tools via Gemini function calling (can combine with google_search)
  use_tools: false
  temperature: 0.0

openrouter:
  # Three modality slots — Studio picks by prompt intent
  text_model: google/gemini-2.5-flash
  image_model: google/gemini-2.5-flash-image
  video_model: google/veo-2.0
  api_key: null
  temperature: 0.0
  base_url: https://openrouter.ai/api/v1

huggingface:
  # Three modality slots — Studio picks by prompt intent
  text_model: microsoft/Phi-3.5-mini-instruct
  image_model: stable-diffusion-v1-5/stable-diffusion-v1-5
  video_model: ali-vilab/text-to-video-ms-1.7b
  # repo_id is kept as an alias of text_model for older configs
  repo_id: microsoft/Phi-3.5-mini-instruct
  revision: main
  device: auto
  torch_dtype: auto
  max_new_tokens: 2048
  temperature: 0.0
  top_p: 0.9
  trust_remote_code: false
  hf_token: null

prompt:
  # Control Panel → Extra system instructions (appended to generation prompts)
  extra_instructions: ""

ui:
  sound_enabled: true
  crt_enabled: false
  ui_scale: 1.0
  # App chrome font (Control Panel → Display). Default Inter is more readable than Retro Pixel.
  ui_font: inter
  app_theme: light  # light | dark | custom
  custom_theme:
    desktop_color: "#008080"
    window_color: "#c0c0c0"
    title_color: "#000080"
    text_color: "#222222"
    font: sans  # legacy; ui_font is preferred
  window_width: 1280
  window_height: 800
  title: "Retro 98 AI Creator"

paths:
  archives: archives.json
  media: media

# Video Edit (Viewer → Edit on a video) requires ffmpeg + ffprobe on PATH
# (or a common Windows install location). Install from https://ffmpeg.org/
