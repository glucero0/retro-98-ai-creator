[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-98-ai-creator"
version = "0.1.0"
description = "Single-window general AI studio for text, images, video, and music"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Retro 98 AI Creator contributors" }]
keywords = ["ai", "studio", "documentation", "gemini", "lyria"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "pywebview>=5.3",
  "PyYAML>=6.0",
  "google-genai>=1.0",
  "youtube-transcript-api>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
retro-98-ai-creator = "retro_98_ai_creator.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retro_98_ai_creator*"]

[tool.setuptools.package-data]
retro_98_ai_creator = ["ui/**/*", "data/**/*"]
